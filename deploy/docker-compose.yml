# ---------------------------------------------------------------------------
# Eshop application stack for Dokploy.
#
# Contains ONLY the five .NET services. Keycloak is a separate Dokploy
# Compose service built from the private theme repo (see DEPLOYMENT.md §7),
# so the two have independent lifecycles and can be redeployed separately.
#
# Managed services (external): PostgreSQL, MongoDB, Redis, RabbitMQ.
#
# Dokploy's Traefik owns ports 80/443 and terminates TLS. `gateway` joins the
# external `dokploy-network` so Traefik can reach it; the other services stay
# on the private `eshop` bridge.
#
# In the Dokploy UI:
#   Compose Path: deploy/docker-compose.yml
#   Environment:  the contents of deploy/.env
#
# Domain routing uses the Traefik labels below. If you prefer the Dokploy
# "Domains" tab, delete the `labels:` block and add the domain there
# instead (do not do both).
# ---------------------------------------------------------------------------

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  Keycloak__Authority: https://${AUTH_DOMAIN}/realms/Eshop
  Keycloak__Audience: eshop-api
  Keycloak__RequireHttpsMetadata: "true"
  ConnectionStrings__Rabbitmq: "${RABBITMQ_CONNECTION}"
  ConnectionStrings__Redis: "${REDIS_CONNECTION}"

x-service: &service
  restart: unless-stopped
  stop_grace_period: 30s
  extra_hosts:
    # Keycloak runs in another Dokploy stack. Containers reach it through its
    # public URL (https://${AUTH_DOMAIN}) resolved to the host, where Traefik
    # routes it. No shared Docker network is needed.
    - "${AUTH_DOMAIN}:host-gateway"

services:
  catalog:
    <<: *service
    build:
      context: ..
      dockerfile: Src/Services/Eshop.Catalog/Dockerfile
    image: eshop/catalog:${TAG:-latest}
    environment:
      <<: *common-env
      ConnectionStrings__CatalogDb: "Host=${PG_HOST};Port=${PG_PORT};Database=${CATALOG_DB};Username=${PG_USER};Password=${PG_PASSWORD};SSL Mode=${PG_SSL_MODE};Maximum Pool Size=10"
      ConnectionStrings__CatalogMongoDb: "${MONGO_CONNECTION}"
      Mongo__Database: ${MONGO_DATABASE}
      UploadCare__PublicKey: ${UPLOADCARE_PUBLIC_KEY}
      UploadCare__SecretKey: ${UPLOADCARE_SECRET_KEY}
      UploadCare__Store: ${UPLOADCARE_STORE:-1}
      UploadCare__UploadCareBaseUrl: ${UPLOADCARE_BASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - eshop

  inventory:
    <<: *service
    build:
      context: ..
      dockerfile: Src/Services/Eshop.Inventory/Dockerfile
    image: eshop/inventory:${TAG:-latest}
    environment:
      <<: *common-env
      ConnectionStrings__InventoryDb: "Host=${PG_HOST};Port=${PG_PORT};Database=${INVENTORY_DB};Username=${PG_USER};Password=${PG_PASSWORD};SSL Mode=${PG_SSL_MODE};Maximum Pool Size=10"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - eshop

  orders:
    <<: *service
    build:
      context: ..
      dockerfile: Src/Services/Eshop.Orders/Dockerfile
    image: eshop/orders:${TAG:-latest}
    environment:
      <<: *common-env
      ConnectionStrings__OrderDb: "Host=${PG_HOST};Port=${PG_PORT};Database=${ORDER_DB};Username=${PG_USER};Password=${PG_PASSWORD};SSL Mode=${PG_SSL_MODE};Maximum Pool Size=10"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - eshop

  notification:
    <<: *service
    build:
      context: ..
      dockerfile: Src/Services/Eshop.Notification/Dockerfile
    image: eshop/notification:${TAG:-latest}
    environment:
      <<: *common-env
      EmailService__ApiKey: ${EMAIL_API_KEY}
      EmailService__BaseUrl: ${EMAIL_BASE_URL}
      EmailService__SenderName: ${EMAIL_SENDER_NAME}
      EmailService__SenderEmail: ${EMAIL_SENDER_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - eshop

  gateway:
    <<: *service
    build:
      context: ..
      dockerfile: Src/Services/Eshop.Gateway/Dockerfile
    image: eshop/gateway:${TAG:-latest}
    environment:
      <<: *common-env
      ForwardedHeaders__TrustAll: "true"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      ReverseProxy__Clusters__Paymentcluster__Destinations__destination1__Address: http://payment:8080
      ReverseProxy__Clusters__Catalogcluster__Destinations__destination1__Address: http://catalog:8080
      ReverseProxy__Clusters__Inventorycluster__Destinations__destination1__Address: http://inventory:8080
      ReverseProxy__Clusters__Ordercluster__Destinations__destination1__Address: http://orders:8080
      ReverseProxy__Clusters__Cartcluster__Destinations__destination1__Address: http://orders:8080
      ReverseProxy__Clusters__CategoryCluster__Destinations__destination1__Address: http://catalog:8080
      ReverseProxy__Clusters__DiscountCluster__Destinations__destination1__Address: http://catalog:8080
    depends_on:
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
      orders:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.eshop-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.eshop-api.entrypoints=websecure"
      - "traefik.http.routers.eshop-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.eshop-api.loadbalancer.server.port=8080"
    networks:
      - eshop
      - dokploy-network

networks:
  eshop:
    driver: bridge
  dokploy-network:
    external: true
