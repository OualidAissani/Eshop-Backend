#docker run -d --name keycloak -p 8080:8080 -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin quay.io/keycloak/keycloak:24.0.4 start-dev

services:
    keycloak:
        image: quay.io/keycloak/keycloak:26.5.0
        container_name: keycloak
        ports:
            - 8180:8080
        environment:
            - KEYCLOAK_ADMIN=admin
            - KEYCLOAK_ADMIN_PASSWORD=admin
        command: ["start-dev"]
        volumes:
            - keycloak-volume:/opt/keycloak/data
#$ docker run -d --hostname my-rabbit --name some-rabbit -e RABBITMQ_DEFAULT_USER=user -e RABBITMQ_DEFAULT_PASS=password rabbitmq:3-management

    Rabbitmq:
        image: rabbitmq:4.2-management
        container_name: rabbitmq
        ports:
            - 5672:5672
            - 15672:15672
        environment:
            - RABBITMQ_DEFAULT_USER=user
            - RABBITMQ_DEFAULT_PASS=password 
        volumes:
            - rabbitmq-volume:/opt/rabbitmq/data

volumes:
    keycloak-volume:
    rabbitmq-volume:
