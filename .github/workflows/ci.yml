name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Hard stop: without this a stuck step can run until GitHub's 6-hour limit.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Src/Services/Eshop.slnx

      - name: Check for vulnerable packages
        run: dotnet list Src/Services/Eshop.slnx package --vulnerable

      - name: Build
        run: dotnet build Src/Services/Eshop.slnx --no-restore --configuration Release

      - name: Start MongoDB
        run: |
          # Tests connect to mongodb://localhost:27017.
          #
          # Why 7.0 and not 8.x: MongoDB 8.0+ refuses to start on Linux kernel
          # 6.19 - 7.0.13 (TCMalloc/rseq, SERVER-121912) and the guard still
          # rejects Ubuntu 26.04's kernel even though it is past 7.0.14
          # (SERVER-136848, open). GitHub's ubuntu-latest runners are affected,
          # so `mongo:8` exits immediately with "MongoDB cannot start".
          # MongoDB 7.0 has no such guard. Production uses Atlas, so this only
          # affects CI.
          #
          # Pull first: `docker run` has no timeout of its own, so a stalled
          # image download would otherwise hang this step indefinitely.
          timeout 300 docker pull mongo:7.0
          docker run -d --name mongodb -p 27017:27017 mongo:7.0

          # Bounded wait. The container can exit right after `docker run` returns
          # 0 (bad image, unsupported kernel). Without a deadline the loop below
          # spins until the job timeout, which is why CI once sat at this step
          # for hours with no error.
          for attempt in $(seq 1 60); do
            if [ -z "$(docker ps --quiet --filter name=^mongodb$)" ]; then
              echo "::error::MongoDB container exited before becoming ready."
              docker logs mongodb || true
              if docker logs mongodb 2>&1 | grep -q "known incompatibility"; then
                echo "::error::This image refuses to start on the runner kernel (SERVER-121912). Keep mongo:7.0 or a 8.x build that no longer ships the startup guard."
              fi
              exit 1
            fi

            if docker exec mongodb mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" > /dev/null 2>&1; then
              echo "MongoDB is ready after ${attempt} attempt(s)."
              exit 0
            fi

            echo "Waiting for MongoDB... (${attempt}/60)"
            sleep 2
          done

          echo "::error::MongoDB did not become ready within 120s."
          docker ps -a
          docker logs --tail 200 mongodb || true
          exit 1

      - name: Test
        run: dotnet test Src/Services/Eshop.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=results.xml" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
